name: Pruebas y ejecutable para Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # necesario solo para publicar el .exe en un Release al crear una etiqueta v*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Compilar DetectorFraude.exe
        run: pyinstaller --noconfirm --onefile --windowed --name DetectorFraude --paths src empaquetado/lanzador.py

      - name: Subir el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DetectorFraude-windows
          path: dist/DetectorFraude.exe
          retention-days: 30

      - name: Publicar Release (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DetectorFraude.exe
