[project]
name = "detector-fraude"
version = "0.1.0"
description = "App de escritorio local para revisar comprobantes contables y priorizar posibles fraudes"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "pandas>=2.0"]

[project.scripts]
detector-fraude = "detector_fraude.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
